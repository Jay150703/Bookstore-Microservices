spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

spring.cloud.gateway.routes[2].id=cart-service
spring.cloud.gateway.routes[2].uri=lb://cart-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.routes[3].id=wishlist-service
spring.cloud.gateway.routes[3].uri=lb://wishlist-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/wishlist/**

spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=lb://order-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[5].id=feedback-service
spring.cloud.gateway.routes[5].uri=lb://feedback-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/feedback/**

spring.cloud.gateway.routes[6].id=admin-service
spring.cloud.gateway.routes[6].uri=lb://admin-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/admin/**

spring.cloud.gateway.routes[7].id=customer-service
spring.cloud.gateway.routes[7].uri=lb://customer-details-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*